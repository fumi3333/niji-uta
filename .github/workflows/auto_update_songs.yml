name: Auto Update Song Database

on:
  schedule:
    # 毎日 日本時間 午前4時 (UTC 19:00) に自動実行
    - cron: '0 19 * * *'
  workflow_dispatch: # GitHubの画面から手動実行も可能

permissions:
  contents: write # 収集結果を master に push するため（既定の GITHUB_TOKEN は read のみ）

jobs:
  update-songs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pykakasi

      - name: Run Song Collection & Enrichment Pipeline
        run: |
          python scripts/auto_update_dataset.py

      - name: Collect new videos via YouTube Data API
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/collect_youtube.py

      - name: Build static SEO pages
        run: python scripts/build_static_pages.py

      - name: Commit and Push Changes
        # ブランチでの試走時は push しない
        if: github.ref == 'refs/heads/master'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/song_performances.json data/youtube_records.json data/channel_map.json index.html popular/index.html sitemap.xml liver song
          if git diff --staged --quiet; then
            echo "No changes in song dataset."
          else
            git commit -m "chore(data): auto-update song database [skip ci]"
            git push origin master
          fi
